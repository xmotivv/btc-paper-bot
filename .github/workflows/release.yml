name: Release

# Bump "version" in package.json and push to main (or run `npm run release:patch`).
# If that version hasn't been released yet, this builds the Windows installer
# and publishes it as GitHub Release v<version>. Installed copies of the app
# check Releases every 30 minutes and update themselves.
# You can also run it by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$V already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm install

      - if: steps.check.outputs.skip != 'true'
        run: npm test

      - name: Create version tag
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          V="${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            git tag "$V"
            git push origin "$V"
          fi

      - name: Build and publish installer
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
