name: Release

# Bump "version" in package.json and push to main (or run `npm run release:patch`).
# If that version hasn't been released yet, this builds the Windows installer
# and publishes it as GitHub Release v<version>. Installed copies of the app
# check Releases every 30 minutes and update themselves.
# You can also run it by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove broken releases (missing installer or latest.yml)
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(([.assets[].name] | join(" ") | (contains("latest.yml") and contains(".exe")) | not)) | .id' |
          while read -r id; do
            echo "Deleting incomplete release $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Skip if this version is already released
        id: check
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$V" -q '[.assets[].name]|join(" ")' 2>/dev/null || true)
          if [[ "$ASSETS" == *latest.yml* && "$ASSETS" == *.exe* ]]; then
            echo "$V already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm install

      - if: steps.check.outputs.skip != 'true'
        run: npm test

      - name: Create tag and draft release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          V="${{ steps.check.outputs.version }}"
          gh release create "$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$V" --draft --notes "BTC Paper Bot $V"

      - name: Build installer and upload to the draft
        if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --publish always

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          V="${{ steps.check.outputs.version }}"
          gh release edit "$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$V" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
